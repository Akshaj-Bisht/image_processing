<!doctype html>
<html>
  <head>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-900 flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-8 rounded-xl w-96 shadow-lg text-center">
      <h2 class="text-white text-2xl font-bold mb-4">Upload Files / Folders</h2>

      <form method="post" enctype="multipart/form-data" class="space-y-4">
        <!-- Drag Drop Area -->
        <label
          id="dropZone"
          class="block border-2 border-dashed border-gray-500 p-6 rounded-lg cursor-pointer text-gray-300 hover:border-blue-500"
        >
          <p>Drag & Drop files or folders</p>
          <p class="text-sm text-gray-400">Click to browse</p>

          <input
            id="fileInput"
            type="file"
            name="files"
            class="hidden"
            multiple
            webkitdirectory
          />
        </label>

        <!-- Selected files list -->
        <div id="fileList" class="text-sm text-left text-gray-300"></div>

        <input
          type="text"
          name="message"
          placeholder="Commit message"
          required
          class="w-full p-2 rounded bg-gray-700 text-white"
        />

        <button
          class="w-full bg-purple-600 hover:bg-purple-700 text-white p-2 rounded"
        >
          Upload
        </button>
      </form>
    </div>

    <script>
      const input = document.getElementById("fileInput");
      const fileList = document.getElementById("fileList");
      const dropZone = document.getElementById("dropZone");

      // Show file names
      input.addEventListener("change", () => {
        fileList.innerHTML = "";
        for (const file of input.files) {
          fileList.innerHTML += `<div>📁 ${file.webkitRelativePath || file.name}</div>`;
        }
      });

      // Drag & drop
      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("border-blue-500");
      });

      dropZone.addEventListener("dragleave", () => {
        dropZone.classList.remove("border-blue-500");
      });

      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        input.files = e.dataTransfer.files;
        input.dispatchEvent(new Event("change"));
      });
    </script>
  </body>
</html>
